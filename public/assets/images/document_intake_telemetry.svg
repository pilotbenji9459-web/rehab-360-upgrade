<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="dit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b17"/>
      <stop offset="50%" stop-color="#071830"/>
      <stop offset="100%" stop-color="#030c18"/>
    </linearGradient>
    <linearGradient id="dit-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5cc2bd" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dit-doc1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0c213d"/>
    </linearGradient>
    <filter id="dit-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#dit-bg)"/>

  <!-- Scanning Matrix Grid -->
  <g stroke="#112745" stroke-width="1" opacity="0.35">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Left: Multi-Source Document Stack (Word, Excel, PDF) -->
  <g transform="translate(60, 60)">
    <!-- Document 3: Excel Workbook (Under) -->
    <g transform="translate(30, 20) rotate(-6)">
      <rect width="180" height="250" rx="10" fill="#061c16" stroke="#10b981" stroke-width="1.5"/>
      <rect x="15" y="15" width="40" height="12" rx="3" fill="#10b981"/>
      <text x="35" y="24" fill="#04121d" font-family="monospace" font-size="8" font-weight="800" text-anchor="middle">.XLSX</text>
      <!-- Grid cells -->
      <line x1="15" y1="45" x2="165" y2="45" stroke="#0e3d2e"/>
      <line x1="15" y1="65" x2="165" y2="65" stroke="#0e3d2e"/>
      <line x1="15" y1="85" x2="165" y2="85" stroke="#0e3d2e"/>
      <line x1="15" y1="105" x2="165" y2="105" stroke="#0e3d2e"/>
      <line x1="15" y1="125" x2="165" y2="125" stroke="#0e3d2e"/>
    </g>

    <!-- Document 2: Word Narrative Report (Middle) -->
    <g transform="translate(15, 10) rotate(3)">
      <rect width="180" height="250" rx="10" fill="#081e3a" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="15" y="15" width="40" height="12" rx="3" fill="#0284c7"/>
      <text x="35" y="24" fill="#ffffff" font-family="monospace" font-size="8" font-weight="800" text-anchor="middle">.DOCX</text>
      <!-- Text lines -->
      <rect x="15" y="45" width="120" height="6" rx="2" fill="#1e3a5f"/>
      <rect x="15" y="60" width="150" height="5" rx="2" fill="#152b48"/>
      <rect x="15" y="72" width="135" height="5" rx="2" fill="#152b48"/>
      <rect x="15" y="84" width="145" height="5" rx="2" fill="#152b48"/>
    </g>

    <!-- Document 1: Official PDF Intake Form (Top Active) -->
    <g transform="translate(0, 0)">
      <rect width="190" height="260" rx="10" fill="url(#dit-doc1)" stroke="#38bdf8" stroke-width="2" filter="url(#dit-glow)"/>
      <rect x="15" y="15" width="40" height="14" rx="3" fill="#ef4444"/>
      <text x="35" y="25" fill="#ffffff" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">.PDF</text>
      <text x="65" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">INTAKE ASSESSMENT</text>
      <!-- Form lines -->
      <line x1="15" y1="42" x2="175" y2="42" stroke="#38bdf8" stroke-width="1"/>
      <rect x="15" y="55" width="160" height="18" rx="4" fill="#08182d" stroke="#1e3a5f"/>
      <text x="22" y="68" fill="#94a3b8" font-family="monospace" font-size="8">NAME: MARCUS VANCE</text>

      <rect x="15" y="82" width="75" height="18" rx="4" fill="#08182d" stroke="#1e3a5f"/>
      <text x="22" y="95" fill="#94a3b8" font-family="monospace" font-size="8">AGE: 26</text>

      <rect x="100" y="82" width="75" height="18" rx="4" fill="#08182d" stroke="#1e3a5f"/>
      <text x="106" y="95" fill="#94a3b8" font-family="monospace" font-size="8">RISK: MED</text>

      <!-- OCR Content Rows -->
      <rect x="15" y="112" width="160" height="6" rx="2" fill="#5cc2bd" opacity="0.8"/>
      <rect x="15" y="125" width="145" height="5" rx="2" fill="#38bdf8" opacity="0.6"/>
      <rect x="15" y="137" width="155" height="5" rx="2" fill="#38bdf8" opacity="0.6"/>
      <rect x="15" y="149" width="130" height="5" rx="2" fill="#38bdf8" opacity="0.6"/>

      <!-- Stamp -->
      <rect x="90" y="195" width="85" height="28" rx="4" fill="#0a2a1a" stroke="#10b981" stroke-width="1.5" transform="rotate(-8, 90, 195)"/>
      <text x="132" y="213" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle" transform="rotate(-8, 90, 195)">
        AI VERIFIED
      </text>
    </g>

    <!-- Laser Scanning Beam (Sweeping Across Active Document) -->
    <line x1="-20" y1="125" x2="220" y2="125" stroke="url(#dit-laser)" stroke-width="4" filter="url(#dit-glow)"/>
  </g>

  <!-- Center: Extraction Flow & Conversion Pipeline -->
  <g transform="translate(295, 130)">
    <!-- Pipeline conduit -->
    <path d="M 0 55 L 70 55 C 90 55, 100 55, 120 55" fill="none" stroke="#1e3e66" stroke-width="4"/>
    <path d="M 0 55 L 70 55 C 90 55, 100 55, 120 55" fill="none" stroke="#5cc2bd" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- Neural Parsing Core -->
    <circle cx="60" cy="55" r="28" fill="#061a30" stroke="#5cc2bd" stroke-width="2" filter="url(#dit-glow)"/>
    <circle cx="60" cy="55" r="18" fill="#0a284a"/>
    <polygon points="54,48 68,55 54,62" fill="#5cc2bd"/>
    <text x="60" y="98" fill="#5cc2bd" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
      OCR &amp; NLP
    </text>
    <text x="60" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">
      SCHEMA PARSER
    </text>
  </g>

  <!-- Right: Extracted Structured Database Telemetry -->
  <g transform="translate(440, 50)">
    <!-- Frame -->
    <rect width="320" height="340" rx="14" fill="#081c33" stroke="#1d4370" stroke-width="2"/>

    <!-- Top Bar -->
    <rect width="320" height="40" rx="14" fill="#0b2342"/>
    <rect y="30" width="320" height="10" fill="#0b2342"/>
    <line x1="0" y1="40" x2="320" y2="40" stroke="#1d4370" stroke-width="1.5"/>

    <circle cx="20" cy="20" r="6" fill="#10b981"/>
    <text x="35" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="800">
      STRUCTURED CASE INGESTION
    </text>
    <rect x="235" y="10" width="70" height="20" rx="4" fill="#072b22" stroke="#10b981" stroke-width="1"/>
    <text x="270" y="24" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
      PARSED 100%
    </text>

    <!-- Parsed Schema Cards -->
    <g transform="translate(15, 55)">
      <!-- Field 1: 9-Domain Baseline -->
      <rect width="290" height="48" rx="6" fill="#061324" stroke="#1b395d" stroke-width="1"/>
      <text x="12" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="600">MAPPED DOMAIN</text>
      <text x="12" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">9-Domain Baseline &amp; Criminal Severity</text>
      <text x="230" y="28" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">EXTRACTED</text>

      <!-- Field 2: Education & Literacy Level -->
      <g transform="translate(0, 56)">
        <rect width="290" height="48" rx="6" fill="#061324" stroke="#1b395d" stroke-width="1"/>
        <text x="12" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="600">EDUCATIONAL ATTAINMENT</text>
        <text x="12" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Secondary / Level 2 Literacy Equivalent</text>
        <text x="230" y="28" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">EXTRACTED</text>
      </g>

      <!-- Field 3: Industry Certifications -->
      <g transform="translate(0, 112)">
        <rect width="290" height="48" rx="6" fill="#061324" stroke="#1b395d" stroke-width="1"/>
        <text x="12" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="600">VERIFIED CERTIFICATIONS</text>
        <text x="12" y="34" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Forklift Counterbalance · CSCS Card</text>
        <text x="230" y="28" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">EXTRACTED</text>
      </g>

      <!-- Field 4: Human-in-the-Loop Gate Confirmation -->
      <g transform="translate(0, 168)">
        <rect width="290" height="52" rx="6" fill="#09243a" stroke="#0284c7" stroke-width="1.5"/>
        <text x="12" y="18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="800">
          HUMAN AUDIT REQUIRED BEFORE COMMIT
        </text>
        <text x="12" y="34" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">
          Strict policy: Extracted values require Case Manager approval.
        </text>
      </g>
    </g>
  </g>
</svg>
