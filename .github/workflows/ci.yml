name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/settings-login-and-pathway-polish"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run scenario tests
        run: npm test
      - name: Run localization regression checks
        run: npm run test:i18n
      - name: Build production bundle
        run: npm run build
