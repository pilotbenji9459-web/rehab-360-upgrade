name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/settings-login-and-pathway-polish"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run scenario tests
        run: npm test
      - name: Test interactive case explorer
        run: npm run test:case-explorer
      - name: Test sidebar light mode and scroll reveals
        run: npm run test:visual
      - name: Verify tour visuals and search alignment
        run: npm run test:tour-visuals
      - name: Verify role-aware mode controls
        run: npm run test:mode-ui
      - name: Build production bundle
        run: npm run build
