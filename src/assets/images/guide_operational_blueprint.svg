<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360">
  <defs>
    <linearGradient id="gob-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040c1a"/>
      <stop offset="50%" stop-color="#091c33"/>
      <stop offset="100%" stop-color="#051222"/>
    </linearGradient>
    <linearGradient id="gob-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#5cc2bd"/>
    </linearGradient>
    <linearGradient id="gob-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="gob-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="360" fill="url(#gob-bg)"/>

  <!-- Blueprint Circuit / Flow Grid -->
  <g stroke="#163254" stroke-width="1" opacity="0.4">
    <line x1="0" y1="60" x2="960" y2="60"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="640" y1="0" x2="640" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
  </g>

  <!-- Connecting Workflow Pipeline Beam -->
  <line x1="100" y1="180" x2="860" y2="180" stroke="#1d4d80" stroke-width="8" stroke-linecap="round"/>
  <line x1="100" y1="180" x2="860" y2="180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Step Node 1: Intake & 9-Domain Baseline -->
  <g transform="translate(100, 180)">
    <circle cx="0" cy="0" r="38" fill="#081e35" stroke="#38bdf8" stroke-width="2.5" filter="url(#gob-glow)"/>
    <circle cx="0" cy="0" r="28" fill="#0c2b4d"/>
    <text x="0" y="-5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">01</text>
    <text x="0" y="10" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">ASSESS</text>
    <!-- Label Below -->
    <text x="0" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Clinical Intake</text>
    <text x="0" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">9-Domain Evaluation</text>
  </g>

  <!-- Step Node 2: Explainable Recommendation -->
  <g transform="translate(290, 180)">
    <circle cx="0" cy="0" r="38" fill="#072b26" stroke="#5cc2bd" stroke-width="2.5" filter="url(#gob-glow)"/>
    <circle cx="0" cy="0" r="28" fill="#0c3f38"/>
    <text x="0" y="-5" fill="#5cc2bd" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">02</text>
    <text x="0" y="10" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">ANALYSE</text>
    <text x="0" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Algorithmic Suggestion</text>
    <text x="0" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Transparent Rules Engine</text>
  </g>

  <!-- Step Node 3: Multidisciplinary Human Sign-Off (Central Anchor) -->
  <g transform="translate(480, 180)">
    <circle cx="0" cy="0" r="48" fill="#0c2545" stroke="#10b981" stroke-width="3.5" filter="url(#gob-glow)"/>
    <circle cx="0" cy="0" r="36" fill="#08382c"/>
    <text x="0" y="-6" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">03</text>
    <text x="0" y="12" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">HUMAN VERIFY</text>
    <text x="0" y="72" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Multi-Disciplinary Review</text>
    <text x="0" y="88" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Mandatory Officer Sign-Off</text>
  </g>

  <!-- Step Node 4: 70% Evidence Pathway Gate -->
  <g transform="translate(670, 180)">
    <circle cx="0" cy="0" r="38" fill="#201036" stroke="#c084fc" stroke-width="2.5" filter="url(#gob-glow)"/>
    <circle cx="0" cy="0" r="28" fill="#321657"/>
    <text x="0" y="-5" fill="#c084fc" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">04</text>
    <text x="0" y="10" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">MILESTONE</text>
    <text x="0" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4-Level Progression</text>
    <text x="0" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">&#8805; 70% Verified Gate Threshold</text>
  </g>

  <!-- Step Node 5: Encrypted Reintegration Handover -->
  <g transform="translate(860, 180)">
    <circle cx="0" cy="0" r="38" fill="#2e1903" stroke="#fbbf24" stroke-width="2.5" filter="url(#gob-glow)"/>
    <circle cx="0" cy="0" r="28" fill="#452606"/>
    <text x="0" y="-5" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">05</text>
    <text x="0" y="10" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">HANDOVER</text>
    <text x="0" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Parole Reintegration</text>
    <text x="0" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">AES-256 Encrypted Transfer</text>
  </g>

  <!-- Top Institutional Bar -->
  <g transform="translate(50, 25)">
    <rect width="860" height="34" rx="6" fill="#081a30" stroke="#1d4370" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="5" fill="#5cc2bd"/>
    <text x="35" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">
      REHABPATH360 OPERATIONAL BLUEPRINT &amp; EVIDENCE-BASED GOVERNANCE
    </text>
    <text x="840" y="22" fill="#5cc2bd" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="end">
      15-Step Clinical &amp; Custodial Protocol
    </text>
  </g>
</svg>
