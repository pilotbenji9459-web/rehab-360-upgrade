<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="cpt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b18"/>
      <stop offset="50%" stop-color="#07172e"/>
      <stop offset="100%" stop-color="#040d1a"/>
    </linearGradient>
    <linearGradient id="cpt-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cpt-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#5cc2bd"/>
    </linearGradient>
    <linearGradient id="cpt-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="cpt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="400" fill="url(#cpt-bg)"/>

  <!-- Radial Background Grid & Perspective Rings -->
  <g stroke="#143054" stroke-width="1" opacity="0.45">
    <circle cx="260" cy="210" r="40"/>
    <circle cx="260" cy="210" r="75"/>
    <circle cx="260" cy="210" r="115"/>
    <line x1="260" y1="85" x2="260" y2="335"/>
    <line x1="135" y1="210" x2="385" y2="210"/>
    <line x1="170" y1="120" x2="350" y2="300"/>
    <line x1="170" y1="300" x2="350" y2="120"/>
  </g>

  <!-- LEFT: 5-Axis Psychometric Radar Evaluation Profile -->
  <g id="psychometric-radar">
    <!-- Pentagon Threshold Boundaries -->
    <!-- 100% Full Capacity Boundary: points: (260,95) (369,175) (328,303) (192,303) (151,175) -->
    <polygon points="260,95 369,175 328,303 192,303 151,175" fill="#081e36" stroke="#1d4370" stroke-width="1.5" opacity="0.6"/>
    <!-- 70% Rehabilitation Mandate Gate -->
    <polygon points="260,130 336,185 308,275 212,275 184,185" fill="none" stroke="#5cc2bd" stroke-dasharray="4 3" stroke-width="1.5"/>
    <!-- 40% Baseline Threshold -->
    <polygon points="260,164 304,196 287,247 233,247 216,196" fill="none" stroke="#1e3e66" stroke-width="1"/>

    <!-- Active Patient Evaluated Geometry (Filled Gradient Polygon) -->
    <!-- Actual Evaluated Coordinates: (260,116) (345,182) (311,281) (216,271) (167,180) -->
    <polygon points="260,116 345,182 311,281 216,271 167,180" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2.5" filter="url(#cpt-glow)"/>

    <!-- Radar Data Nodes -->
    <circle cx="260" cy="116" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="345" cy="182" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="311" cy="281" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="216" cy="271" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="167" cy="180" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Center Hub -->
    <circle cx="260" cy="210" r="7" fill="#08223f" stroke="#5cc2bd" stroke-width="2"/>
    <circle cx="260" cy="210" r="2.5" fill="#5cc2bd"/>

    <!-- Axis 1 (Top): Emotional Stability -->
    <text x="260" y="58" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      EMOTIONAL STABILITY
    </text>
    <text x="260" y="74" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      82% · Gate Cleared
    </text>

    <!-- Axis 2 (Top-Right): Conflict De-escalation -->
    <text x="382" y="165" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="start">
      CONFLICT DE-ESCALATION
    </text>
    <text x="382" y="179" fill="#5cc2bd" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="start">
      78% · Verified Baseline
    </text>

    <!-- Axis 3 (Bottom-Right): Social & Peer Dynamics -->
    <text x="338" y="320" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="start">
      SOCIAL DYNAMICS
    </text>
    <text x="338" y="334" fill="#5cc2bd" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="start">
      76% · Pro-Social Group
    </text>

    <!-- Axis 4 (Bottom-Left): Cognitive Reframing -->
    <text x="180" y="320" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">
      COGNITIVE REFRAMING
    </text>
    <text x="180" y="334" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="end">
      65% · Active Psychoeducation
    </text>

    <!-- Axis 5 (Top-Left): Values & Motivation -->
    <text x="138" y="165" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">
      VALUES &amp; MOTIVATION
    </text>
    <text x="138" y="179" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="end">
      85% · High Engagement
    </text>
  </g>

  <!-- RIGHT: Clinical Telemetry Console & Protected Notes Index -->
  <g id="clinical-telemetry-console" transform="translate(545, 20)">
    <!-- Console Card Frame -->
    <rect width="395" height="360" rx="14" fill="#091b33" stroke="#1e3a5f" stroke-width="1.5"/>

    <!-- Console Header Strip -->
    <rect width="395" height="46" rx="14" fill="#0c2340"/>
    <rect y="32" width="395" height="14" fill="#0c2340"/>
    <line x1="0" y1="46" x2="395" y2="46" stroke="#1e3a5f" stroke-width="1.5"/>

    <!-- Security Padlock & Title -->
    <g transform="translate(18, 28)">
      <rect x="0" y="-12" width="16" height="13" rx="3" fill="#9333ea" stroke="#c084fc" stroke-width="1"/>
      <path d="M 3 -12 L 3 -16 C 3 -19, 13 -19, 13 -16 L 13 -12" fill="none" stroke="#c084fc" stroke-width="1.5"/>
      <text x="25" y="-1" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="800">
        CLINICAL EVALUATION TELEMETRY
      </text>
      <text x="25" y="12" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9" font-weight="600">
        SECTION 7 RESTRICTED PSYCHOMETRIC AUDIT
      </text>
    </g>

    <!-- Psychometric Telemetry Cards Container -->
    <g transform="translate(18, 60)">
      <!-- Metric 1: Mood Index (5 Review Cycles) -->
      <rect width="359" height="64" rx="8" fill="#061324" stroke="#1b395d" stroke-width="1"/>
      <text x="14" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">
        LONGITUDINAL MOOD TRAJECTORY (5 REVIEW CYCLES)
      </text>
      <!-- Sparkline -->
      <path d="M 16 48 L 70 42 L 124 45 L 178 33 L 232 26" fill="none" stroke="#5cc2bd" stroke-width="2.5" filter="url(#cpt-glow)"/>
      <circle cx="16" cy="48" r="3" fill="#5cc2bd"/>
      <circle cx="70" cy="42" r="3" fill="#5cc2bd"/>
      <circle cx="124" cy="45" r="3" fill="#5cc2bd"/>
      <circle cx="178" cy="33" r="3" fill="#5cc2bd"/>
      <circle cx="232" cy="26" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
      <!-- Status Badge -->
      <rect x="250" y="24" width="98" height="26" rx="6" fill="#032b24" stroke="#10b981" stroke-width="1"/>
      <text x="299" y="41" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
        +38% STABLE
      </text>

      <!-- Metric 2: Clinical Risk Rating -->
      <g transform="translate(0, 74)">
        <rect width="359" height="64" rx="8" fill="#061324" stroke="#1b395d" stroke-width="1"/>
        <text x="14" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">
          BEHAVIOURAL RISK ASSESSMENT · RNR MODEL
        </text>
        <rect x="14" y="32" width="200" height="12" rx="6" fill="#1e293b"/>
        <rect x="14" y="32" width="165" height="12" rx="6" fill="url(#cpt-teal)"/>
        <!-- Status Badge -->
        <rect x="228" y="24" width="120" height="26" rx="6" fill="#042038" stroke="#38bdf8" stroke-width="1"/>
        <text x="288" y="41" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
          LOW RE-OFFENCE
        </text>
      </g>

      <!-- Metric 3: Assessment Completeness & Attendance -->
      <g transform="translate(0, 148)">
        <rect width="359" height="64" rx="8" fill="#061324" stroke="#1b395d" stroke-width="1"/>
        <text x="14" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">
          CLINICAL SESSION ATTENDANCE &amp; ENGAGEMENT
        </text>
        <text x="14" y="48" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="900">
          96.4%
        </text>
        <text x="96" y="45" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
          27 of 28 sessions completed
        </text>
        <!-- Status Badge -->
        <rect x="250" y="24" width="98" height="26" rx="6" fill="#0c2b22" stroke="#10b981" stroke-width="1"/>
        <text x="299" y="41" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
          CERTIFIED
        </text>
      </g>

      <!-- Role-Based Authorization Badge -->
      <g transform="translate(0, 222)">
        <rect width="359" height="62" rx="8" fill="#130e28" stroke="#7c3aed" stroke-width="1"/>
        <text x="14" y="19" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="800">
          PROTECTED CLINICAL ACCESS ONLY · SEPARATION PROTOCOL
        </text>
        <text x="14" y="35" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">
          Lead Clinician: Dr. Rebecca Vance, CPsychol (Reg. BPS-88412)
        </text>
        <text x="14" y="49" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">
          Longitudinal Validity Confirmed · SHA-256 Tamper-Evident Audit Record
        </text>
      </g>
    </g>
  </g>
</svg>
