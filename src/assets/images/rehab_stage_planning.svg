<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="rsp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b17"/>
      <stop offset="50%" stop-color="#081c35"/>
      <stop offset="100%" stop-color="#030d1a"/>
    </linearGradient>
    <linearGradient id="rsp-pipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="33%" stop-color="#0284c7"/>
      <stop offset="66%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="rsp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#rsp-bg)"/>

  <!-- Timeline Grid -->
  <g stroke="#132e4e" stroke-width="1" opacity="0.4">
    <line x1="80" y1="80" x2="720" y2="80"/>
    <line x1="80" y1="360" x2="720" y2="360"/>
    <line x1="140" y1="60" x2="140" y2="380"/>
    <line x1="300" y1="60" x2="300" y2="380"/>
    <line x1="480" y1="60" x2="480" y2="380"/>
    <line x1="660" y1="60" x2="660" y2="380"/>
  </g>

  <!-- Header Banner -->
  <g transform="translate(80, 35)">
    <rect width="640" height="34" rx="8" fill="#08203c" stroke="#1d4370" stroke-width="1.5"/>
    <circle cx="16" cy="17" r="5" fill="#5cc2bd"/>
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="800">
      INDIVIDUALIZED REHABILITATION TRAJECTORY &amp; STAGE MILESTONES
    </text>
    <text x="520" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">
      12-MONTH PROTOCOL
    </text>
  </g>

  <!-- Connecting Pathway Beam -->
  <line x1="140" y1="220" x2="660" y2="220" stroke="url(#rsp-pipe)" stroke-width="8" stroke-linecap="round" filter="url(#rsp-glow)"/>
  <line x1="140" y1="220" x2="660" y2="220" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Gateway 1: Foundation (Month 1-3) -->
  <g transform="translate(140, 220)">
    <!-- Milestone Node -->
    <circle cx="0" cy="0" r="26" fill="#061a14" stroke="#10b981" stroke-width="3" filter="url(#rsp-glow)"/>
    <circle cx="0" cy="0" r="16" fill="#093d2e"/>
    <text x="0" y="5" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="900" text-anchor="middle">L1</text>

    <!-- Top Card (Objective) -->
    <g transform="translate(-65, -125)">
      <rect width="130" height="85" rx="8" fill="#071c18" stroke="#10b981" stroke-width="1.5"/>
      <rect width="130" height="20" rx="8" fill="#0c3529"/>
      <rect y="12" width="130" height="8" fill="#0c3529"/>
      <text x="65" y="14" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">FOUNDATION</text>
      <text x="65" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Clinical Stabilization</text>
      <text x="65" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Cognitive Reframing</text>
      <text x="65" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Family Connections</text>
      <text x="65" y="74" fill="#10b981" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">MONTHS 1 – 3</text>
    </g>

    <!-- Bottom Metric -->
    <text x="0" y="45" fill="#10b981" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">GATE 1 · 70%</text>
    <text x="0" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Sub-levels 1A-1C</text>
  </g>

  <!-- Gateway 2: Development (Month 4-6) -->
  <g transform="translate(300, 220)">
    <!-- Milestone Node -->
    <circle cx="0" cy="0" r="26" fill="#06182c" stroke="#0284c7" stroke-width="3" filter="url(#rsp-glow)"/>
    <circle cx="0" cy="0" r="16" fill="#09284a"/>
    <text x="0" y="5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="900" text-anchor="middle">L2</text>

    <!-- Top Card (Objective) -->
    <g transform="translate(-65, -125)">
      <rect width="130" height="85" rx="8" fill="#081c34" stroke="#0284c7" stroke-width="1.5"/>
      <rect width="130" height="20" rx="8" fill="#0c2d54"/>
      <rect y="12" width="130" height="8" fill="#0c2d54"/>
      <text x="65" y="14" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">DEVELOPMENT</text>
      <text x="65" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Education &amp; Literacy</text>
      <text x="65" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Adult Classroom</text>
      <text x="65" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Numeracy Level 2</text>
      <text x="65" y="74" fill="#38bdf8" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">MONTHS 4 – 6</text>
    </g>

    <!-- Bottom Metric -->
    <text x="0" y="45" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">GATE 2 · 70%</text>
    <text x="0" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Sub-levels 2A-2C</text>
  </g>

  <!-- Gateway 3: Capability (Month 7-9) -->
  <g transform="translate(480, 220)">
    <!-- Milestone Node -->
    <circle cx="0" cy="0" r="26" fill="#180e2a" stroke="#8b5cf6" stroke-width="3" filter="url(#rsp-glow)"/>
    <circle cx="0" cy="0" r="16" fill="#2d174e"/>
    <text x="0" y="5" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="900" text-anchor="middle">L3</text>

    <!-- Top Card (Objective) -->
    <g transform="translate(-65, -125)">
      <rect width="130" height="85" rx="8" fill="#150d26" stroke="#8b5cf6" stroke-width="1.5"/>
      <rect width="130" height="20" rx="8" fill="#29144a"/>
      <rect y="12" width="130" height="8" fill="#29144a"/>
      <text x="65" y="14" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">CAPABILITY</text>
      <text x="65" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Vocational Trades</text>
      <text x="65" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Workshop Mastery</text>
      <text x="65" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Forklift / CSCS Cert</text>
      <text x="65" y="74" fill="#c084fc" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">MONTHS 7 – 9</text>
    </g>

    <!-- Bottom Metric -->
    <text x="0" y="45" fill="#c084fc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">GATE 3 · 70%</text>
    <text x="0" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Sub-levels 3A-3C</text>
  </g>

  <!-- Gateway 4: Reintegration (Month 10-12) -->
  <g transform="translate(660, 220)">
    <!-- Milestone Node -->
    <circle cx="0" cy="0" r="26" fill="#241505" stroke="#f59e0b" stroke-width="3" filter="url(#rsp-glow)"/>
    <circle cx="0" cy="0" r="16" fill="#422508"/>
    <text x="0" y="5" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="13" font-weight="900" text-anchor="middle">L4</text>

    <!-- Top Card (Objective) -->
    <g transform="translate(-65, -125)">
      <rect width="130" height="85" rx="8" fill="#1f1104" stroke="#f59e0b" stroke-width="1.5"/>
      <rect width="130" height="20" rx="8" fill="#3d2105"/>
      <rect y="12" width="130" height="8" fill="#3d2105"/>
      <text x="65" y="14" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">REINTEGRATION</text>
      <text x="65" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Community Handover</text>
      <text x="65" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Parole Supervision</text>
      <text x="65" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Housing &amp; GP Link</text>
      <text x="65" y="74" fill="#f59e0b" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">MONTHS 10 – 12</text>
    </g>

    <!-- Bottom Metric -->
    <text x="0" y="45" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">GATE 4 · 70%</text>
    <text x="0" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Sub-levels 4A-4C</text>
  </g>

  <!-- Bottom Human-in-the-Loop Governance Bar -->
  <g transform="translate(80, 375)">
    <rect width="640" height="42" rx="8" fill="#071b30" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="9" fill="#0284c7"/>
    <path d="M 17 21 L 19 23 L 24 18" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="38" y="19" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
      GOVERNANCE: MULTIDISCIPLINARY CASE CONFERENCE VERIFICATION REQUIRED AT EACH GATE
    </text>
    <text x="38" y="33" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9">
      No automated promotions. Governing Governor, Clinical Psychologist, and Case Manager must certify evidentiary threshold.
    </text>
  </g>
</svg>
